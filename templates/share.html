<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="Dota 2 Review Assistant">
    <title>Dota 2 复盘报告 · 比赛 #{{ analysis.match_id }}</title>
    <style>
{{ inline_css|safe }}

/* ===== Static share page ===== */
.share-header {
    justify-content: space-between;
    gap: 16px;
}

.share-header .logo { cursor: default; }

.share-header-meta {
    color: var(--text-secondary);
    font-size: 0.78rem;
}

.share-badge {
    color: var(--gold);
    border: 1px solid rgba(246, 201, 14, 0.35);
    background: rgba(246, 201, 14, 0.08);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
}

/* Static reports must stay readable without JavaScript. */
.share-page .player-panel {
    display: block;
    scroll-margin-top: 16px;
}

.share-page .player-panel + .player-panel {
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
}

.share-page .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.share-page .player-tab {
    text-decoration: none;
}

.share-player-nav {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
    scroll-margin-top: 16px;
}

.share-nav-title {
    color: var(--text-secondary);
    font-size: 0.8rem;
    margin-bottom: 10px;
}

.share-nav-links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px;
}

.share-player-link {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card2);
    color: var(--text-primary);
    text-decoration: none;
    font-size: 0.82rem;
}

.share-player-link:hover {
    border-color: var(--accent);
}

.share-player-link strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.share-player-name {
    color: var(--text-secondary);
    font-size: 0.75rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.share-player-team {
    flex: 0 0 auto;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
}

.share-back-link {
    color: var(--text-secondary);
    font-size: 0.78rem;
    text-decoration: none;
    white-space: nowrap;
}

.share-back-link:hover {
    color: var(--accent);
}

.share-section {
    margin-top: 18px;
    padding-top: 4px;
}

.share-section + .share-section {
    border-top: 1px solid var(--border);
    padding-top: 14px;
}

.share-section-title {
    color: var(--accent);
    font-size: 0.9rem;
    margin: 12px 0 10px;
}

.share-footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    color: var(--text-secondary);
    font-size: 0.75rem;
    text-align: center;
    line-height: 1.8;
}
    </style>
</head>
<body class="share-page">
    <header class="site-header share-header">
        <span class="logo">
            <span class="logo-icon">D2</span>
            <span>Dota 2 复盘报告</span>
        </span>
        <span class="share-header-meta">
            比赛 #{{ analysis.match_id }} · 生成于 {{ generated_at.strftime("%Y-%m-%d %H:%M") }}
        </span>
    </header>

    <main class="container">
        {% include "partials/match_report.html" %}
    </main>

    <footer class="share-footer">
        数据来源 OpenDota · 分锅分析为数据模型评估，仅供复盘参考
    </footer>

    <script>
        window.MATCH_DATA = {{ analysis.model_dump(mode="json") | tojson | safe }};
    </script>
    <script>{{ inline_app_js|safe }}</script>
    <script>{{ inline_charts_js|safe }}</script>
</body>
</html>
